<h3>Total chuletones: {{ service.count() }}</h3>
<button class="add-button" routerLink="/form">Añadir chuletón</button>
<ul *ngIf="service.chuletones().length > 0; else emptyList">
   <li *ngFor="let c of service.chuletones()">
      {{ c.tipo }} - {{ c.origen }} - {{ c.peso }}g - x{{ c.cantidad }}
   </li>
</ul>

<ng-template #emptyList>
   <p>No hay chuletones añadidos aún.</p>
</ng-template>
